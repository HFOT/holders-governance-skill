    xs.forEach((x,i)=>{ s+=`<rect x="${x}" y="${520-hs[i]}" width="70" height="${hs[i]}" fill="${a}" opacity="${.08+i*.06}"/><rect x="${x}" y="${520-hs[i]}" width="70" height="2" fill="${a}" opacity=".7"/>`;
      s+=`<text x="${x+35}" y="${520-hs[i]-14}" text-anchor="middle" fill="${a}" font-size="18" font-family="Archivo" opacity=".8">${'①②③④'[i]}</text>`; });
    return s; },
  pulse(a,b){ let d='M60 330'; for(let i=1;i<=52;i++){const x=60+i*8.5,y=330-Math.abs(Math.sin(i*.7)*70+Math.random()*40)*(i%9==0?2.2:1);d+=` L${x} ${y}`;}
    let s=`<path d="${d}" stroke="${a}" stroke-width="2.5" stroke-opacity=".85"/><path d="${d} L500 330 Z" fill="${a}" opacity=".08"/>`;
    for(let r=0;r<4;r++) s+=`<rect x="60" y="${380+r*48}" width="440" height="1" fill="${a}" opacity=".18"/>`;
    return s; },
  wave(a,b){ let s=''; for(let k=0;k<3;k++){let d=`M40 ${300+k*30}`; for(let x=40;x<=500;x+=6){d+=` L${x} ${300+k*30+Math.sin(x*.045+k)*Math.exp(-Math.pow((x-270)/150,2))*90}`;}
      s+=`<path d="${d}" stroke="${k==0?a:b}" stroke-width="${2.5-k*.6}" stroke-opacity="${.85-k*.3}"/>`; }
    for(let i=0;i<40;i++){const x=60+i*11;const h=8+Math.abs(Math.sin(i*.9))*60;s+=`<rect x="${x}" y="${470-h/2}" width="5" height="${h}" rx="2" fill="${a}" opacity=".45"/>`;}
    return s; },
  tree(a,b){ let s=''; const node=(x,y,c)=>`<circle cx="${x}" cy="${y}" r="7" fill="${c}"/>`;
    const link=(x1,y1,x2,y2,o)=>`<path d="M${x1} ${y1} C ${x1} ${(y1+y2)/2}, ${x2} ${(y1+y2)/2}, ${x2} ${y2}" stroke="${a}" stroke-opacity="${o}" stroke-width="1.5"/>`;
    s+=node(330,60,a);
    let xs=[330]; let y=60;
    for(let d=1;d<=3;d++){const ny=y+130;const nx=[];xs.forEach(x=>{const sp=120/d; for(const k of [-1,0,1]){const cx=x+k*sp; nx.push(cx); s+=link(x,y,cx,ny,.5-d*.1)+node(cx,ny,d==3?b:a);}}); xs=nx;y=ny;}
    return s; },
  gears(a,b){ const gear=(cx,cy,r,n,o)=>{let d='';for(let i=0;i<n*2;i++){const t=i*Math.PI/n,rr=i%2?r:r*1.2;d+=(i?'L':'M')+(cx+Math.cos(t)*rr)+' '+(cy+Math.sin(t)*rr)+' ';}
      return `<path d="${d}Z" stroke="${a}" stroke-opacity="${o}" stroke-width="2" fill="${a}" fill-opacity=".05"/><circle cx="${cx}" cy="${cy}" r="${r*.35}" stroke="${a}" stroke-opacity="${o}"/>`;};
    return gear(400,170,80,10,.55)+gear(500,290,55,8,.4)+gear(330,330,45,7,.4)+gear(430,450,95,12,.28); }
};
