<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>OGP generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Noto+Sans+JP:wght@300;400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#06070a}
body{font-family:"Archivo","Noto Sans JP",system-ui,sans-serif;color:#f2f4f8;position:relative}
.bg{position:absolute;inset:0;background:
  radial-gradient(900px 520px at 88% 8%, var(--glow) 0%, transparent 62%),
  radial-gradient(700px 500px at 0% 100%, var(--glow2) 0%, transparent 60%),
  #06070a}
.grid{position:absolute;inset:0;opacity:.11;background-image:
  linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);
  background-size:60px 60px;
  -webkit-mask-image:radial-gradient(800px 500px at 100% 0%,#000 0%,transparent 70%)}
.top{position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--a),var(--b))}
.kicker{position:absolute;left:64px;top:62px;font-size:16px;letter-spacing:.32em;text-transform:uppercase;color:rgba(242,244,248,.5);font-weight:600}
.mark{position:absolute;left:64px;top:110px;width:56px;height:56px;border-radius:14px;display:none}
h1{position:absolute;left:64px;top:118px;font-size:74px;line-height:1.02;font-weight:800;letter-spacing:-.025em;
   font-variation-settings:"wdth" 100;max-width:1000px}
h1 .g{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
h1 .thin{font-weight:500;color:rgba(242,244,248,.62)}
h1.two{top:96px;font-size:62px;line-height:1.05}
.sub{position:absolute;left:64px;top:230px;font-family:"Noto Sans JP",sans-serif;font-size:30px;font-weight:700;letter-spacing:.02em;color:#e6e9ef}
h1.two + .sub{top:248px}
.desc{position:absolute;left:64px;top:292px;font-family:"Noto Sans JP",sans-serif;font-size:21px;line-height:1.75;font-weight:400;color:rgba(242,244,248,.72);max-width:640px}
h1.two ~ .desc{top:322px}
.facts{position:absolute;left:64px;top:418px;display:flex;gap:14px}
.fact{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.035);border-radius:12px;padding:14px 20px;min-width:150px}
.fact .k{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:rgba(242,244,248,.5);font-weight:600}
.fact .v{margin-top:6px;font-size:26px;font-weight:800;letter-spacing:-.01em;color:var(--a)}
.foot{position:absolute;left:64px;right:64px;bottom:46px;display:flex;justify-content:space-between;align-items:baseline;
  font-family:"Noto Sans JP",sans-serif;font-size:16px;color:rgba(242,244,248,.55)}
.foot .tags span+span::before{content:"／";margin:0 14px;color:rgba(242,244,248,.3)}
.foot .url{font-family:"JetBrains Mono",monospace;font-size:19px;font-weight:700;color:var(--a);letter-spacing:0}
.art{position:absolute;right:0;top:0;width:520px;height:630px;pointer-events:none}
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div><div class="top"></div>
<svg class="art" id="art" viewBox="0 0 520 630" fill="none"></svg>
<div class="kicker" id="kicker"></div>
<h1 id="title"></h1>
<div class="sub" id="sub"></div>
<div class="desc" id="desc"></div>
<div class="facts" id="facts"></div>
<div class="foot"><div class="tags" id="tags"></div><div class="url" id="url"></div></div>
<script>
const SITES = {
  catalyst: {
    a:'#6BA6FF', b:'#a9d0ff', glow:'rgba(107,166,255,.22)', glow2:'rgba(107,166,255,.08)',
    kicker:'Project Catalyst / Japan', title:'Catalyst <span class="g">Japan</span>',
    sub:'Catalyst の日本提案まとめ。',
    desc:'130件を金額・分野・進捗で並べ替える。完了報告と動画まで一枚に載せた、F2 から F14 の全記録。',
    facts:[['Proposals','130'],['Funded','21.6M ₳'],['Rounds','F2 – F14']],
    tags:['金額・分野・進捗で並べ替え','完了報告つき','日本語'],
    url:'hfot.github.io/Catalyst-Japan', art:'dots'
  },
  cmap: {
    a:'#3D7BFF', b:'#7fb0ff', glow:'rgba(61,123,255,.24)', glow2:'rgba(61,123,255,.08)',
    kicker:'Project Catalyst / World', title:'Catalyst <span class="g">Detailed Map</span>',
    sub:'Catalyst 提案の世界 MAP。',
    desc:'6年で 2,221件が採択され、1,722件が完了した。国・人物・一件まで地図から辿り、提案と完了報告を原文のまま左右に並べる。',
    facts:[['Funded','2,221'],['Reports','1,716'],['Countries','96']],
    tags:['達成・未達の判断はしない','原文のまま','日本語・English'],
    url:'hfot.github.io/holders-core/catalyst-map', art:'globe'
  },
  core: {
    a:'#f5f1e8', b:'#b8b0a0', glow:'rgba(245,241,232,.10)', glow2:'rgba(245,241,232,.05)',
    kicker:'Cardano / Full-Record Analysis', title:'holders <span class="g">CORE</span>',
    sub:'Cardano の現状を、全件データで分析。',
    desc:'11,385件を ①提案 → ②採択 → ③納品 → ④使用 で並べ、どこで止まったかを一次情報付きで示す。欠落も数えて出す。',
    facts:[['Proposals','11,385'],['Unrecorded ④','2,347'],['Rounds','F2 – F15']],
    tags:['一次情報つき','欠落も数える','日本語・English'],
    url:'hfot.github.io/holders-core', art:'steps'
  },
  poc: {
    a:'#6EE7B7', b:'#22D3EE', glow:'rgba(110,231,183,.20)', glow2:'rgba(34,211,238,.08)',
    kicker:'Cardano / Developer Ecosystem', title:'Proof of <span class="g">Code</span>',
    sub:'GitHub で測る、開発の実態マップ。',
    desc:'GitHub の 924 リポジトリから、確かに脈打つ 210 を測って棚に並べた。折れ線は52週の鼓動。数字はすべて自前の測定。',
    facts:[['Repos','210'],['Population','924'],['Shelves','8']],
    tags:['52週の鼓動','自前測定のみ','借りたのはロゴだけ'],
    url:'hfot.github.io/proof-of-code', art:'pulse'
  },
  translate: {
    a:'#a855f7', b:'#6366f1', glow:'rgba(168,85,247,.24)', glow2:'rgba(99,102,241,.10)',
    kicker:'Speech → Subtitles / In-Browser', title:'Space <span class="g">Translate</span>',
    sub:'音声を、その場で字幕翻訳。',
    desc:'分からない言語の音声を、その場で文字にして翻訳する。文字起こしはブラウザの中で完結し、APIキーもインストールも要らない。',
    facts:[['Engine','Whisper'],['Runs','In browser'],['Cost','Free']],
    tags:['APIキー不要','インストール不要','ブラウザ内で完結'],
    url:'hfot.github.io/space-translate/app.html', art:'wave'
  },
  dvm: {
    a:'#22D3EE', b:'#6EE7B7', glow:'rgba(34,211,238,.22)', glow2:'rgba(79,134,255,.10)',
    kicker:'Dialogue / Agent Simulation', title:'Dialogue<br><span class="g">Verification</span> Model',
    sub:'議論が閉じる分岐を、10万回検証。',
    desc:'中心人物のいない場が、なぜ同じ形で閉じていくのか。27通りを全数列挙し、10万回のシミュレーションで確かめた。',
    facts:[['Paths','27'],['Simulated','100k×'],['Cost','Free']],
    tags:['全数列挙','仮説として提示','日本語・English'],
    url:'hfot.github.io/dialogue-verification-model', art:'tree', two:true
  },
  carakuri: {
    a:'#d9b86a', b:'#b0863c', glow:'rgba(217,184,106,.20)', glow2:'rgba(176,134,60,.08)',
    kicker:'Cardano / 3D Automata Town', title:'<span class="g">CARAKURI</span> <span class="thin" style="font-size:.62em">からくりの町</span>',
    sub:'Cardano の仕組みを、3Dからくりで。',
    desc:'8体のからくりと一つの城郭都市として組み上げた。六つの門はリレー健全性の6軸、議事堂はDRep、大金庫はトレジャリー。',
    facts:[['Automata','8'],['Buildings','5'],['Gates','6']],
    tags:['ブラウザ内で手続き生成','外部アセット不要','実測ではなく、寓話'],
    url:'hfot.github.io/nomad-3d', art:'gears'
  }
};

const ART = {
  dots(a,b){ let s=''; for(let i=0;i<70;i++){const x=120+Math.random()*380,y=40+Math.random()*560,r=1.5+Math.random()*3.5;
    s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${a}" opacity="${.15+Math.random()*.5}"/>`;}
    return s+`<circle cx="360" cy="300" r="150" stroke="${a}" stroke-opacity=".25"/><circle cx="360" cy="300" r="220" stroke="${a}" stroke-opacity=".12"/>`; },
  globe(a,b){ let s=`<circle cx="330" cy="315" r="210" stroke="${a}" stroke-opacity=".3"/>`;
    for(const k of [-140,-70,0,70,140]) s+=`<ellipse cx="330" cy="315" rx="${Math.sqrt(210*210-k*k)}" ry="${Math.sqrt(210*210-k*k)*.22}" transform="translate(0 ${k})" stroke="${a}" stroke-opacity=".18"/>`;
    for(const k of [60,130,190]) s+=`<ellipse cx="330" cy="315" rx="${k}" ry="210" stroke="${a}" stroke-opacity=".18"/>`;
    for(let i=0;i<24;i++){const t=Math.random()*6.28,r=Math.random()*200;s+=`<circle cx="${330+Math.cos(t)*r}" cy="${315+Math.sin(t)*r*.95}" r="3" fill="${a}" opacity=".8"/>`;}
    return s; },
  steps(a,b){ let s=''; const xs=[150,250,350,450]; const hs=[360,260,170,100];
    xs.forEach((x,i)=>{ s+=`<rect x="${x}" y="${520-hs[i]}" width="70" height="${hs[i]}" fill="${a}" opacity="${.08+i*.06}"/><rect x="${x}" y="${520-hs[i]}" width="70" height="2" fill="${a}" opacity=".7"/>`;
      s+=`<text x="${x+35}" y="${520-hs[i]-14}" text-anchor="middle" fill="${a}" font-size="18" font-family="Archivo" opacity=".8">${'①②③④'[i]}</text>`; });
    return s; },
  pulse(a,b){ let d='M60 330'; for(let i=1;i<=52;i++){const x=60+i*8.5,y=330-Math.abs(Math.sin(i*.7)*70+Math.random()*40)*(i%9==0?2.2:1);d+=` L${x} ${y}`;}
    let s=`<path d="${d}" stroke="${a}" stroke-width="2.5" stroke-opacity=".85"/><path d="${d} L500 330 Z" fill="${a}" opacity=".08"/>`;
    for(let r=0;r<4;r++) s+=`<rect x="60" y="${380+r*48}" width="440" height="1" fill="${a}" opacity=".18"/>`;
    return s; },
  wave(a,b){ let s=''; for(let k=0;k<3;k++){let d=`M40 ${300+k*30}`; for(let x=40;x<=500;x+=6){d+=` L${x} ${300+k*30+Math.sin(x*.045+k)*Math.exp(-Math.pow((x-270)/150,2))*90}`;}
      s+=`<path d="${d}" stroke="${k==0?a:b}" stroke-width="${2.5-k*.6}" stroke-opacity="${.85-k*.3}"/>`; }
    for(let i=0;i<40;i++){const x=60+i*11;const h=8+Math.abs(Math.sin(i*.9))*60;s+=`<rect x="${x}" y="${470-h/2}" width="5" height="${h}" rx="2" fill="${a}" opacity=".45"/>`;}
    return s; },
  tree(a,b){ let s=''; const node=(x,y,c)=>`<circle cx="${x}" cy="${y}" r="7" fill="${c}"/>`;
    const link=(x1,y1,x2,y2,o)=>`<path d="M${x1} ${y1} C ${x1} ${(y1+y2)/2}, ${x2} ${(y1+y2)/2}, ${x2} ${y2}" stroke="${a}" stroke-opacity="${o}" stroke-width="1.5"/>`;
    s+=node(330,60,a);
    let xs=[330]; let y=60;
    for(let d=1;d<=3;d++){const ny=y+130;const nx=[];xs.forEach(x=>{const sp=120/d; for(const k of [-1,0,1]){const cx=x+k*sp; nx.push(cx); s+=link(x,y,cx,ny,.5-d*.1)+node(cx,ny,d==3?b:a);}}); xs=nx;y=ny;}
    return s; },
  gears(a,b){ const gear=(cx,cy,r,n,o)=>{let d='';for(let i=0;i<n*2;i++){const t=i*Math.PI/n,rr=i%2?r:r*1.2;d+=(i?'L':'M')+(cx+Math.cos(t)*rr)+' '+(cy+Math.sin(t)*rr)+' ';}
      return `<path d="${d}Z" stroke="${a}" stroke-opacity="${o}" stroke-width="2" fill="${a}" fill-opacity=".05"/><circle cx="${cx}" cy="${cy}" r="${r*.35}" stroke="${a}" stroke-opacity="${o}"/>`;};
    return gear(400,170,80,10,.55)+gear(500,290,55,8,.4)+gear(330,330,45,7,.4)+gear(430,450,95,12,.28); }
};

const id = new URLSearchParams(location.search).get('id') || 'catalyst';
const S = SITES[id];
document.documentElement.style.setProperty('--a',S.a);
document.documentElement.style.setProperty('--b',S.b);
document.documentElement.style.setProperty('--glow',S.glow);
document.documentElement.style.setProperty('--glow2',S.glow2);
kicker.textContent=S.kicker; title.innerHTML=S.title; if(S.two) title.classList.add('two');
sub.textContent=S.sub; desc.textContent=S.desc;
facts.innerHTML=S.facts.map(([k,v])=>`<div class="fact"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
tags.innerHTML=S.tags.map(t=>`<span>${t}</span>`).join('');
url.textContent=S.url;
art.innerHTML=ART[S.art](S.a,S.b);
document.title='og-'+id;
</script>
</body>
</html>
