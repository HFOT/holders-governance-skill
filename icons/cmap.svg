<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Catalyst Detailed Map">
  <title>Catalyst Detailed Map</title>

  <!-- 他の印と同じ暗い角丸の地。並べたとき縁が揃う。 -->
  <rect width="32" height="32" rx="7" fill="#1a1715"/>

  <!-- 経緯線の球。地図そのものではなく、地図を読む道具であることを示す。 -->
  <circle cx="16" cy="16" r="8.2" fill="none" stroke="#f5f1e8" stroke-width="1.7"/>
  <path d="M16 7.8 A4.6 8.2 0 0 1 16 24.2 A4.6 8.2 0 0 1 16 7.8Z"
        fill="none" stroke="#f5f1e8" stroke-width="1.15" opacity=".72"/>
  <path d="M8.2 13.1 H23.8 M8.2 18.9 H23.8"
        fill="none" stroke="#f5f1e8" stroke-width="1.15" opacity=".72"/>

  <!-- 記録がある一点だけが灯る。全部は光らない。 -->
  <circle cx="21.1" cy="11.6" r="2.7" fill="#1a1715"/>
  <circle cx="21.1" cy="11.6" r="1.75" fill="#3D7BFF"/>
</svg>
