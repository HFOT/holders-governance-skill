<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SPO Onchain Alive">
  <title>SPO Onchain Alive</title>
  <defs>
    <linearGradient id="g" x1="6" y1="5" x2="26" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#5b8bff"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded ground so the mark holds its edge on a light browser tab. -->
  <rect width="32" height="32" rx="7.5" fill="#0a0726"/>

  <!-- Broken shells, the way the page's ORBIT motif draws an axis: never a
       closed circle, only what a crowd of arcs adds up to. Left open on
       purpose so the mark does not read as the closed hexagon on the relay
       icon, which is the page this one draws its numbers from. -->
  <path d="M16 4.6a11.4 11.4 0 0 1 9.9 5.7" fill="none"
        stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
  <path d="M16 27.4a11.4 11.4 0 0 1-9.9-5.7" fill="none"
        stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
  <path d="M22.6 22.6a9.3 9.3 0 0 1-13.2-13.2" fill="none"
        stroke="url(#g)" stroke-width="2.4" stroke-linecap="round" opacity=".6"/>

  <!-- The living core. Solid, because at 16px - the size a tab renders - a
       scatter of motes closes up into a smudge and stops meaning anything. -->
  <circle cx="16" cy="16" r="3.6" fill="#ff5ad0"/>
</svg>
