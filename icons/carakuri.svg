<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CARAKURI">
  <title>CARAKURI</title>

  <!-- The page's own ground, so the tab icon and the site agree. -->
  <rect width="32" height="32" rx="7.5" fill="#14120e"/>

  <!-- The walled city: a hexagon of six gates, drawn as the ring the town is.
       Gold is the only accent the site allows, so it is the only colour here. -->
  <path d="M16 4.6l9.9 5.7v11.4L16 27.4l-9.9-5.7V10.3z" fill="none" stroke="#b0863c" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- The archive tower at the centre, solid so it still reads at 16px, and the
       carried flame above it. -->
  <path d="M13.4 22.6h5.2v-2.4h-.9v-5.1h-3.4v5.1h-.9z" fill="#d9b86a"/>
  <path d="M16 9.2c1.4 1.5 2.2 2.7 2.2 3.9a2.2 2.2 0 0 1-4.4 0c0-1.2.8-2.4 2.2-3.9z" fill="#d9b86a"/>
</svg>
